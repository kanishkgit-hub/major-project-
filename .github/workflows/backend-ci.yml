name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/API.md"
      - "supabase/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/API.md"
      - "supabase/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: "Backend API - lint, SQL syntax and tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff (errors and unused code only)
        run: |
          pip install ruff
          ruff check --isolated --select E4,E7,E9,F app tests --output-format=github

      # The database code cannot run in CI, but it must at least be valid PostgreSQL.
      - name: Check SQL syntax (migrations and isolation test)
        working-directory: .
        run: |
          pip install pglast
          python - <<'EOF'
          import glob, pglast
          files = sorted(glob.glob("supabase/**/*.sql", recursive=True))
          assert files, "no SQL files found"
          for f in files:
              pglast.parse_sql(open(f, encoding="utf-8").read())
              print("OK", f)
          test = open("supabase/tests/manual/gateway_isolation_check.sql", encoding="utf-8").read()
          pglast.parse_plpgsql(test[test.index("create or replace function"): test.index("$fn$;") + 5])
          print("OK PL/pgSQL structure of the isolation test")
          EOF

      - name: Run API tests (also checks docs/API.md matches the code)
        run: pytest -v --tb=short
